name: Production Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build keymgr binaries (macOS/Linux/Windows)
        run: bash scripts/build.sh

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

      - name: Build release AAB
        env:
          SIGNING_STORE_FILE: release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Build release APK
        env:
          SIGNING_STORE_FILE: release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: immichframe-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: immichframe-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.2.0
          name: "v0.2.0"
          body: |
            ## ImmichFrame v0.2.0

            Native Android photo frame app for Immich.

            ### What's New (since v0.1.0)
            - **Launcher Mode** — set as default Home for reliable boot launch (bypasses BOOT_COMPLETED entirely); ideal for dedicated photo frames
            - **Start on Boot fix** — SYSTEM_ALERT_WINDOW permission as BAL exemption; boot_verified self-test
            - **Manual update check** — "Check Now" button under Auto-Update
            - **Launcher UX** — toggle auto-opens home picker; hover-UI exit button switches to another launcher; default-launcher monitoring with re-set prompt

            ### Features
            - Direct Immich API access (no middleman server)
            - Native Jetpack Compose UI (no WebView)
            - Album picker with multi-select
            - Fullscreen slideshow with crossfade transitions
            - Configurable interval, transition speed, fill mode (Contain/Cover)
            - Video playback with mute and skip options (Media3/ExoPlayer)
            - Draggable clock overlay with configurable size and snap-to-grid
            - Photo animations (Ken Burns: zoom in/out, pan left/right/up/down, or random) — also serves as burn-in protection
            - Adaptive background (fills letterbox bars with each photo's dominant color)
            - Shuffle mode for randomized image order
            - Progress bar showing time remaining per image
            - Start on boot (SAW/BAL exemption + OEM autostart detection)
            - Launcher mode (Home replacement) — most reliable boot method
            - Self-update via GitHub releases with manual "Check Now" button (sideloaded installs only)
            - Offline media cache with background sync (Room + WorkManager)
            - Auto-resumes last album on launch
            - Localized into 13 languages (en, ar, zh, nl, fr, de, it, ja, ko, pl, pt, ru, es)
            - Scoped API key (album.read, asset.read, asset.view, asset.download, user.read)
            - API key stored encrypted on-device (AES-256, Android Keystore)

            **SHA:** ${{ github.sha }}
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            dist/keymgr-darwin-arm64
            dist/keymgr-darwin-x64
            dist/keymgr-linux-arm64
            dist/keymgr-linux-x64
            dist/keymgr-windows-x64.exe
            scripts/generate-api-key.sh
            scripts/check-api-key.sh
            scripts/generate-api-key.ps1
            scripts/check-api-key.ps1

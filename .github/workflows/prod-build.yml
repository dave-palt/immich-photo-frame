name: Production Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode signing keystore
        if: ${{ vars.SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ vars.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks
          echo "storeFile=release.jks" >> app/local signing.properties

      - name: Build release AAB
        env:
          SIGNING_STORE_FILE: ${{ vars.SIGNING_KEYSTORE_BASE64 != '' && 'app/release.jks' || '' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: immichframe-release
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 90

name: Dev Build

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Spotless (code style check)
        run: ./gradlew spotlessCheck --no-daemon

      - name: Android Lint
        run: ./gradlew lintDebug --no-daemon --no-configuration-cache

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*.html
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        # Debug APK is signed with the committed app/debug.keystore
        # (same key locally and in CI) so the two are interchangeable.
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: immichframe-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish dev pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "dev-${{ github.sha }}" \
            --repo ${{ github.repository }} \
            --target ${{ github.sha }} \
            --title "Dev Build (unstable)" \
            --notes "⚠️ Unstable development build — auto-generated from latest develop branch.

          Commit: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}

          Install at your own risk. Not a stable release." \
            --prerelease \
            app/build/outputs/apk/debug/*.apk

      - name: Delete old dev pre-releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep only the 3 most recent dev releases
          gh api repos/${{ github.repository }}/releases --paginate \
            --jq '[.[] | select(.tag_name | startswith("dev-"))] | sort_by(.published_at) | reverse | .[3:][] | .tag_name' \
          | while read -r tag; do
              echo "Deleting old release: $tag"
              gh release delete "$tag" --repo ${{ github.repository }} --yes --cleanup-tag
            done
